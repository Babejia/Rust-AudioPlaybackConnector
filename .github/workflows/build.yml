name: build

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build (release)
        run: cargo build --release

      - name: Collect
        shell: bash
        run: |
          ls -l target/release/*.exe
          mkdir -p out
          cp target/release/audio-playback-connector-rs.exe out/ || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AudioPlaybackConnector-rs
          path: out/
          if-no-files-found: error

      # 推 tag（v1.2.3 这种）时，自动建 Release 并把 exe 挂上去
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            out/audio-playback-connector-rs.exe \
            --title "AudioPlaybackConnector (Rust) ${GITHUB_REF_NAME}" \
            --generate-notes
